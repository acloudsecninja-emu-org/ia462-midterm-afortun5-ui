title: Windows PowerShell Script Block Execution (EventID 4104)
id: 61279475-2f53-43b7-8367-c326ab066045
status: experimental
description: |
    Detects suspicious PowerShell script block execution via EventID 4104
author: afortun5-ui
date: 2026/11/22
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
    - https://attack.mitre.org/techniques/T1105/
logsource:
    product: windows
    category: ps_script
detection:
    selection:
        ScriptBlockText|contains:
            - 'Invoke-Expression'
            - 'IEX'
            - 'EncodedCommand'
            - '-enc'
            - 'DownloadString'
    condition: selection
falsepositives:
    - Legitimate administrator scripts that use -EncodedCommand or download cradles
    - Network troubleshooting
    - Routine maintenance
level: high
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1027
    - attack.t1105

